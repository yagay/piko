name: Windows Magnet Filter Debug

on:
  push:
    branches:
      - feature/android-folder-auto-cleanup
  workflow_dispatch:

concurrency:
  group: windows-magnet-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5

      # Keep this feature build focused on the magnet filter. The full shared
      # suite currently has unrelated intermittent proxy loopback test failures.
      - name: Test magnet filter and Windows preferences
        shell: pwsh
        run: |
          .\gradlew.bat :shared:desktopTest --tests '*MagnetFileSelectionFilterTest*' --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\gradlew.bat :desktopApp:desktopTest --tests '*DesktopSettingsStoreTest*' --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows test application
        shell: pwsh
        run: |
          .\gradlew.bat :desktopApp:createDistributable --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive Windows application folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'desktopApp/build/compose/binaries/main/app/Piko'
          if (!(Test-Path "$app/Piko.exe")) { throw "Piko.exe was not produced in $app" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path $app -DestinationPath "dist/piko-windows-${{ matrix.arch }}-magnet-debug.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v6
        with:
          name: piko-windows-${{ matrix.arch }}-magnet-debug
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
