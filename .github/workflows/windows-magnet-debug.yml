name: Windows x64 Portable Debug

on:
  push:
    branches:
      - feature/android-folder-auto-cleanup
  workflow_dispatch:

concurrency:
  # Reuse previous MSI group so a pending installer run is cancelled by this portable build.
  group: windows-x64-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64-portable:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5

      - name: Test magnet filtering, player settings and desktop preferences
        shell: pwsh
        run: |
          .\gradlew.bat :shared:desktopTest --tests '*MagnetFileSelectionFilterTest*' --tests '*StoredPikoPreferencesTest*' --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\gradlew.bat :desktopApp:desktopTest --tests '*DesktopSettingsStoreTest*' --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 portable application
        shell: pwsh
        run: |
          .\gradlew.bat :desktopApp:createDistributable --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable app with local data marker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'desktopApp/build/compose/binaries/main/app/Piko'
          if (!(Test-Path "$app/Piko.exe")) { throw "Piko.exe was not produced in $app" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & .github/scripts/pack-portable.ps1 -AppDir $app -Output 'dist/piko-windows-x64-debug-portable.7z'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'dist/piko-windows-x64-debug-portable.7z')) { throw 'Portable archive was not generated' }

      - uses: actions/upload-artifact@v6
        with:
          name: piko-windows-x64-debug-portable
          path: dist/piko-windows-x64-debug-portable.7z
          if-no-files-found: error
          retention-days: 14
